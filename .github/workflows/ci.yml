name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      # Windows keeps debug information, so that the stack of a crashing test names its functions.
      BUILD_CONFIG: ${{ matrix.os == 'windows-latest' && 'RelWithDebInfo' || 'Release' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          modules: "qtmultimedia"

      - name: Configure
        run: cmake -S . -B build -DFQW_BUILD_EXAMPLES=ON -DFQW_BUILD_TESTS=ON

      - name: Build (Linux / Windows)
        if: runner.os != 'macOS'
        run: cmake --build build --config ${{ env.BUILD_CONFIG }} --parallel 2

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --parallel 2 --target FluentQtWidgets FluentQtWidgetsGallery

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build --build-config Release --output-on-failure

      # Windows-only code (native hit testing, frameless windows) is only covered here; the runner has
      # an interactive desktop, which the widget tests need.
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build --build-config ${{ env.BUILD_CONFIG }} --output-on-failure

      # ctest captures none of the Windows tests' output here. Run the failed suites again with QTest
      # writing its log to a file, which also keeps what a crashing suite wrote before it crashed, and
      # with their own output in files: QTest prints the stack of a crash there. A crashing suite also
      # runs under the console debugger when there is one.
      - name: Failed test logs (Windows)
        if: failure() && runner.os == 'Windows'
        run: |
          function Invoke-Logged($program, $arguments, $directory, $output) {
            $process = Start-Process -FilePath $program -ArgumentList $arguments -WorkingDirectory $directory `
              -NoNewWindow -PassThru -RedirectStandardOutput "$output.out" -RedirectStandardError "$output.err"
            $null = $process.Handle
            if (!$process.WaitForExit(300000)) { $process.Kill() }
            return $process.ExitCode
          }
          $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          $failed = Get-Content build/Testing/Temporary/LastTestsFailed.log -ErrorAction SilentlyContinue
          foreach ($entry in $failed) {
            $name = $entry.Split(':', 2)[1]
            $exe = Join-Path $PWD "build/tests/$env:BUILD_CONFIG/$name.exe"
            if (!(Test-Path $exe)) { continue }
            $directory = Split-Path $exe
            $output = Join-Path $env:RUNNER_TEMP $name
            $exitCode = Invoke-Logged $exe @('-o', "$output.txt,txt") $directory $output
            "::group::$name (exit code $exitCode)"
            Get-Content "$output.txt", "$output.out", "$output.err" -ErrorAction SilentlyContinue
            if ($exitCode -eq -1073741819 -and (Test-Path $cdb)) {
              '--- under cdb ---'
              $null = Invoke-Logged $cdb @('-G', '-lines', '-y', $directory, '-c', '"g; .lastevent; .ecxr; kn 60; q"', $exe) $directory "$output.cdb"
              Get-Content "$output.cdb.out" -ErrorAction SilentlyContinue | Select-Object -Last 150
            }
            '::endgroup::'
          }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          modules: "qtmultimedia"

      - name: Configure
        run: cmake -S . -B build -DFQW_BUILD_EXAMPLES=ON -DFQW_BUILD_TESTS=OFF

      - name: Build Gallery
        run: cmake --build build --config Release --parallel 2 --target FluentQtWidgets FluentQtWidgetsGallery

      - name: Package Gallery artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          release_name="FluentQtWidgetsGallery-${{ matrix.os }}-${GITHUB_REF_NAME}"
          package_root="${RUNNER_TEMP}/${release_name}"
          rm -rf "$package_root"
          mkdir -p "$package_root"

          app_target="$(find build/examples/gallery -maxdepth 6 -type d -name 'FluentQtWidgetsGallery.app' | head -n 1 || true)"
          binary_target="$(find build/examples/gallery -maxdepth 6 -type f \( -name 'FluentQtWidgetsGallery.exe' -o -name 'FluentQtWidgetsGallery' \) | head -n 1 || true)"

          if [ -n "$app_target" ] && [ -d "$app_target" ]; then
            bundle="$package_root/$(basename "$app_target")"
            cp -R "$app_target" "$package_root/"
            # Qt's frameworks and FFmpeg are universal, but the Gallery is built for one architecture:
            # keeping only that one halves them.
            arch="$(lipo -archs "$bundle/Contents/MacOS/FluentQtWidgetsGallery")"
            if [ "$(wc -w <<< "$arch")" -eq 1 ]; then
              while IFS= read -r -d '' file; do
                if archs="$(lipo -archs "$file" 2>/dev/null)" && [ "$(wc -w <<< "$archs")" -gt 1 ]; then
                  lipo "$file" -thin "$arch" -output "$file.thin"
                  cat "$file.thin" > "$file"
                  rm "$file.thin"
                fi
              done < <(find "$bundle" -type f -print0)
            fi
            # Only the executable carries the linker's signature, which leaves the bundled frameworks
            # and resources unsealed; macOS then calls the downloaded app damaged instead of offering
            # to open it anyway. The ad-hoc signature covers the whole bundle.
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          elif [ -n "$binary_target" ] && [ -f "$binary_target" ]; then
            if [ "${{ runner.os }}" = "Linux" ]; then
              cp "$binary_target" "$package_root/"
            else
              cp -R "$(dirname "$binary_target")/." "$package_root/"
            fi
          else
            echo "Unable to locate FluentQtWidgetsGallery output."
            find build/examples/gallery -maxdepth 6 -print
            exit 1
          fi

          # The macOS bundle has the library inside; the Linux binary looks for it beside itself.
          if [ -z "$app_target" ]; then
            find build -maxdepth 3 \( -type f -o -type l \) \( \
              -name 'FluentQtWidgets.dll' -o \
              -name 'libFluentQtWidgets*.so*' \
            \) -exec cp -P {} "$package_root/" \;
          fi

          if [ "${{ runner.os }}" = "Windows" ] && [ ! -f "$package_root/Qt6MultimediaWidgets.dll" ]; then
            echo "Missing Qt6MultimediaWidgets.dll from Windows Gallery package."
            exit 1
          fi

          cp README.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md "$package_root/"

          if [ "${{ runner.os }}" = "Windows" ] && command -v 7z >/dev/null 2>&1; then
            7z a "artifacts/${release_name}.zip" "$package_root/."
          else
            tar -czf "artifacts/${release_name}.tar.gz" -C "${RUNNER_TEMP}" "${release_name}"
          fi

      - name: Verify relocated Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          release_name="FluentQtWidgetsGallery-${{ matrix.os }}-${GITHUB_REF_NAME}"
          verify_root="$(mktemp -d)"
          trap 'rm -rf "$verify_root"' EXIT
          tar -xzf "artifacts/${release_name}.tar.gz" -C "$verify_root"
          package_root="$verify_root/$release_name"
          gallery="$package_root/FluentQtWidgetsGallery"
          test -x "$gallery"

          dynamic_entries="$(readelf -d "$gallery")"
          if ! grep -E '\((RUNPATH|RPATH)\)' <<< "$dynamic_entries" | grep -F '$ORIGIN'; then
            echo 'The Linux Gallery executable must search $ORIGIN for its bundled library.'
            exit 1
          fi

          library_name="$(awk '/\(NEEDED\).*libFluentQtWidgets/ { sub(/.*\[/, ""); sub(/\].*/, ""); print; exit }' <<< "$dynamic_entries")"
          test -n "$library_name"
          test -L "$package_root/$library_name"
          test -e "$package_root/$library_name"

          dependencies="$(env -u LD_LIBRARY_PATH ldd "$gallery")"
          printf '%s\n' "$dependencies"
          if grep -F 'not found' <<< "$dependencies"; then
            exit 1
          fi
          resolved_library="$(awk -v name="$library_name" '$1 == name && $2 == "=>" { print $3; exit }' <<< "$dependencies")"
          if [ "$resolved_library" != "$package_root/$library_name" ]; then
            echo "FluentQtWidgets resolved outside the extracted archive: $resolved_library"
            exit 1
          fi

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: artifacts/*
          overwrite_files: true
